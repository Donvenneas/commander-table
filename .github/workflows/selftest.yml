# Every push to any branch: the type check and the Node tests (item 216). Pull requests, pushes to main and manual
# runs also get the self-test page against server.py on Linux and macOS, and against Commander Table.exe and
# server.ps1 on Windows (item 177). The self-test page (endpoint checks, 50 fast games, the 20-game rules check,
# 10 Kingdoms games) runs in headless Chromium.
name: Self-test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# (a push to a branch with an open pull request would run twice: the newer run replaces the older one)
concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    # TypeScript's checker over public/js (no build); fails only on errors not in tests/typecheck-baseline.txt
    # (two Node versions: the oldest still supported and the current one)
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Type check (ratchet)
        run: node tests/typecheck.mjs
      - name: Golden card readings (effects parser over 3,500 saved cards)
        run: node tests/cards.mjs
      - name: Golden games (rules 4 and 5 outcomes unchanged)
        run: node tests/golden.mjs
      - name: Fuzz games (random answers to every prompt, rules watcher)
        run: node tests/fuzz.mjs
      - name: Hidden information (AI decisions with opponents' hidden cards scrambled)
        run: node tests/hidden.mjs
      - name: Card and interaction tests (one board per rule, fix or combo)
        run: node tests/interactions.mjs
      - name: Replay exactness (saved card data and combos, isolation, old replay files)
        run: node tests/replay.mjs
      - name: Loops of triggers (endless loops, loops that end, optional loops, priority, responsiveness)
        run: node tests/loops.mjs
      - name: Combos played out with the real cards (life, damage, combat, mill, Spellbook statuses)
        run: node tests/combos.mjs
      - name: Phyrexian, hybrid and two-brid mana (parsing, planning, life payments, choices)
        run: node tests/mana.mjs
      - name: Replacement effects (zone changes, draws, prevention, entering, tokens; ordering)
        run: node tests/replacements.mjs
      - name: Stack and priority (responses, APNAP, targets, counters)
        run: node tests/stack.mjs
      - name: Card abilities (keywords, protection, prowess, triggers, activated and static abilities)
        run: node tests/abilities.mjs

  selftest:
    # (item 177) server.py and the self-test on Linux and macOS (the game's Mac and Linux path)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (Chromium)
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium

      - name: Check server.py compiles
        run: python -m py_compile server.py

      - name: server.py's own check of this computer
        run: python server.py --check

      - name: Start the game server
        run: |
          python server.py --no-browser --port 8777 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8777/ > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1

      - name: Run the self-test
        run: python tests/selftest_ci.py --url http://localhost:8777

  windows:
    # (item 177) build Commander Table.exe and run the self-test against it, then against server.ps1 (start.bat's server)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (Chromium)
        run: |
          pip install playwright==1.49.1
          python -m playwright install chromium

      - name: Build Commander Table.exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File launcher\build.ps1

      - name: Self-test against Commander Table.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\Commander Table.exe' -ArgumentList '--no-window' -PassThru
          $up = $false
          for ($i = 0; $i -lt 30 -and -not $up; $i++) { try { Invoke-WebRequest -UseBasicParsing http://localhost:8777/ | Out-Null; $up = $true } catch { Start-Sleep 1 } }
          if (-not $up) { throw 'Commander Table.exe did not answer on port 8777' }
          try { python tests/selftest_ci.py --url http://localhost:8777; if ($LASTEXITCODE) { throw 'self-test failed (.exe)' } }
          finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Self-test against server.ps1
        shell: pwsh
        run: |
          $p = Start-Process -FilePath powershell -ArgumentList '-ExecutionPolicy','Bypass','-File','server.ps1','-Port','8778','-NoBrowser' -PassThru
          $up = $false
          for ($i = 0; $i -lt 40 -and -not $up; $i++) { try { Invoke-WebRequest -UseBasicParsing http://localhost:8778/ | Out-Null; $up = $true } catch { Start-Sleep 1 } }
          if (-not $up) { throw 'server.ps1 did not answer on port 8778' }
          try { python tests/selftest_ci.py --url http://localhost:8778; if ($LASTEXITCODE) { throw 'self-test failed (server.ps1)' } }
          finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
