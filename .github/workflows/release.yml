# Publishing a version: bump VERSION, commit, then push a matching tag, for example
#     git tag v1.16.0 && git push origin v1.16.0
# This builds Commander Table.exe and the shareable zip on Windows and attaches the zip to a GitHub release.
# The game's Updates window can then always use:
#     https://github.com/Donvenneas/commander-table/releases/latest/download/commander-table.zip
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: commander-table

      - name: Check the tag matches VERSION
        shell: pwsh
        working-directory: commander-table
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME doesn't match VERSION ($version). Bump VERSION first." }

      - name: Build Commander Table.exe
        shell: pwsh
        working-directory: commander-table
        run: powershell -ExecutionPolicy Bypass -File launcher\build.ps1

      - name: Build the shareable zip
        shell: pwsh
        working-directory: commander-table
        run: |
          powershell -ExecutionPolicy Bypass -File make-shareable-zip.ps1
          Move-Item -LiteralPath '..\Commander Table (portable).zip' -Destination '..\commander-table.zip'

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME commander-table.zip --repo $env:GITHUB_REPOSITORY --title "Commander Table $($env:GITHUB_REF_NAME.TrimStart('v'))" --generate-notes
