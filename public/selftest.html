<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commander Table · Self-test</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow: auto; }
    .st { max-width: 860px; margin: 0 auto; padding: 20px 16px 40px; }
    .st h1 { font-size: 22px; margin: 0 0 6px; }
    .st table { width: 100%; border-collapse: collapse; margin: 10px 0 18px; font-size: 13px; }
    .st td, .st th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .st .pass { color: var(--good); font-weight: 800; }
    .st .fail { color: var(--bad); font-weight: 800; }
    .st .wait { color: var(--muted); }
    .st .summary { font-size: 16px; font-weight: 700; margin: 8px 0; }
  </style>
</head>
<body>
  <main class="st">
    <h1>Commander Table self-test</h1>
    <p class="muted">Checks every part of the local server and the services the game uses, then plays 50 games at full speed with the built-in cEDH decks. Nothing is changed: the deck library and update checks only read.</p>
    <p><button class="btn primary" id="btnRun">Run the self-test</button> <a class="btn ghost" href="/">Back to the game</a></p>
    <div class="summary" id="summary"></div>
    <h3>Server and services</h3>
    <table id="checks"><tbody></tbody></table>
    <h3>Games</h3>
    <table id="games"><tbody></tbody></table>
  </main>
  <script type="module" src="js/selftest.js"></script>
</body>
</html>
